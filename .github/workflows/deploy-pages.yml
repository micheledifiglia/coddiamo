name: Master Atlas — Pubblicazione sito pubblico

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verifica e pubblica Master Atlas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: master-atlas-2027
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6
      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rigenera e verifica il catalogo
        run: python parse_data.py
      - name: Verifica le funzioni e la protezione dei dati
        run: node --test tests/*.test.cjs
      - name: Prepara il sito pubblico
        run: node scripts/build-pages.mjs
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica soltanto i file pubblici
        uses: actions/upload-pages-artifact@v4
        with:
          path: master-atlas-2027/_site
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
